[project]
name = "sense-harness"
version = "0.1.0"
description = "An agent that gives a base model a new sense, proves it works, and installs it"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=5.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.12",
    "pillow>=11.0",
    "torchvision>=0.21",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "openai>=1.50",
    "anthropic>=2.8.0",
    "trimesh>=5.2.1",
    "rdkit>=2026.9.2",
    "matplotlib>=3.11.2",
]

[dependency-groups]
databricks = [
    "databricks-sdk>=0.166.0",
    "mlflow-skinny>=3.18.0",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
